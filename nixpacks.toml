# Configuración Nixpacks para Railway
# Nota: instalamos las dependencias del sistema necesarias para Puppeteer/Playwright
# (Chromium headless requiere libs de GTK, fontconfig, etc.)

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "glib",
  "nss",
  "nspr",
  "atk",
  "cups",
  "gtk3",
  "pango",
  "cairo",
  "fontconfig",
  "freetype",
  "libxkbcommon",
  "libdrm",
  "mesa",
  "alsa-lib",
  "at-spi2-atk",
  "expat",
]

[phases.install]
# IMPORTANTE: --include=dev fuerza que vite, esbuild y plugins se instalen
# incluso si Railway hereda NODE_ENV=production en el build.
# Usamos `npm install` en vez de `npm ci` para que el lockfile se regenere
# automáticamente cuando agregamos deps nuevas sin correr npm install local
# primero. Es ~5-10s más lento pero evita errores de sincronización.
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
# Por defecto Puppeteer descarga su propio Chromium en postinstall; Nix ya provee uno
# pero conservamos el de Puppeteer para evitar problemas de compatibilidad.
PUPPETEER_SKIP_DOWNLOAD = "false"
# NOTA: NODE_ENV NO se setea acá. El script start de package.json lo pone
# en runtime (NODE_ENV=production node dist/index.js). Setearlo en el build
# rompe npm ci (skipea devDependencies → vite no se instala).
